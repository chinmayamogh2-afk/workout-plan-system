# =============================================================
# docker-compose.yml – Workout Plan Management System
# Services: MySQL 8 + Spring Boot application (pre-built image)
#
# Secrets are NOT stored here. Provide them in a .env file or --env-file
# (see .env.example). Required variables fail fast when missing.
#
# Local development with a build from source:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
# =============================================================

services:

  db:
    image: mysql:8.0
    container_name: workout-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: workout_db
      MYSQL_USER: ${DB_USERNAME:-workout_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set (see .env.example)}
    # No host port is published: only the app container can reach the database.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - workout-network
    healthcheck:
      # MYSQL_PWD keeps the root password out of the process list
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ${APP_IMAGE:-devopsproject/workout-plan-system}:${APP_VERSION:-latest}
    container_name: workout-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/workout_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-workout_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD must be set (see .env.example)}
      APP_TRAINER_PASSWORD: ${APP_TRAINER_PASSWORD:?APP_TRAINER_PASSWORD must be set (see .env.example)}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - workout-network
    security_opt:
      - no-new-privileges:true
    # Health check is defined in the image (Dockerfile HEALTHCHECK) so that
    # `docker run`, Compose, Jenkins and Ansible all use the same definition.

networks:
  workout-network:
    # Fixed name so scripts and rollbacks can rely on it regardless of project name
    name: workout-network
    driver: bridge

volumes:
  mysql_data:
