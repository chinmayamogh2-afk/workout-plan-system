---
# Role: common – prerequisite packages and application directories (idempotent)

- name: Install common packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: [curl, wget, git, unzip, ca-certificates, gnupg, lsb-release, apt-transport-https]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: true
  tags: [common]

- name: Install common packages (macOS via Homebrew)
  community.general.homebrew:
    name: [curl, wget, git]
    state: present
  when: ansible_os_family == "Darwin"
  become: false
  tags: [common]

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/scripts"
    - "{{ app_dir }}/logs"
  tags: [common, config]
