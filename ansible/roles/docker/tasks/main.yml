---
# Role: docker – installs Docker Engine + Compose v2 plugin using native modules.
# Skipped entirely (no changes) when Docker is already present.

- name: Check whether Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false
  tags: [docker]

- name: Install Docker Engine and Compose plugin (Debian/Ubuntu)
  when:
    - ansible_os_family == "Debian"
    - docker_check.rc != 0
  become: true
  tags: [docker]
  block:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

- name: Install Docker Desktop (macOS via Homebrew Cask)
  community.general.homebrew_cask:
    name: docker
    state: present
  when:
    - ansible_os_family == "Darwin"
    - docker_check.rc != 0
  become: false
  tags: [docker]

- name: Start and enable Docker service (Linux)
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: ansible_os_family == "Debian"
  become: true
  tags: [docker]

- name: Allow configured users to use Docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: ansible_os_family == "Debian"
  become: true
  tags: [docker]

- name: Verify Docker and the Compose plugin work
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker --version
    - docker compose version
  register: docker_versions
  changed_when: false
  tags: [docker]

- name: Show Docker versions
  ansible.builtin.debug:
    msg: "{{ docker_versions.results | map(attribute='stdout') | list }}"
  tags: [docker]
