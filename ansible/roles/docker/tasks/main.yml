---
# =============================================================
# Role: docker – Installs Docker and Docker Compose
# Idempotent: uses shell checks before installing
# =============================================================

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false
  tags: [docker]

- name: Add Docker GPG key (Ubuntu/Debian)
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
      gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  when:
    - ansible_os_family == "Debian"
    - docker_check.rc != 0
  become: true
  tags: [docker]

- name: Add Docker repository (Ubuntu/Debian)
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
      https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
      tee /etc/apt/sources.list.d/docker.list > /dev/null
    apt-get update
  when:
    - ansible_os_family == "Debian"
    - docker_check.rc != 0
  become: true
  tags: [docker]

- name: Install Docker (Ubuntu/Debian)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when:
    - ansible_os_family == "Debian"
    - docker_check.rc != 0
  become: true
  tags: [docker]

- name: Install Docker (macOS via Homebrew Cask)
  homebrew_cask:
    name: docker
    state: present
  when:
    - ansible_os_family == "Darwin"
    - docker_check.rc != 0
  tags: [docker]

- name: Start and enable Docker service (Linux)
  systemd:
    name: docker
    state: started
    enabled: true
  when: ansible_os_family == "Debian"
  become: true
  tags: [docker]

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  tags: [docker]

- name: Display Docker version
  debug:
    msg: "Docker installed: {{ docker_version.stdout }}"
  tags: [docker]
