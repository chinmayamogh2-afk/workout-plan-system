---
# Role: java – installs OpenJDK (idempotent; the package manager is the check)

- name: Install OpenJDK on Debian/Ubuntu, version {{ java_version }}
  ansible.builtin.apt:
    name: "openjdk-{{ java_version }}-jdk"
    state: present
  when: ansible_os_family == "Debian"
  become: true
  tags: [java]

- name: Install OpenJDK on macOS via Homebrew, version {{ java_version }}
  community.general.homebrew:
    name: "openjdk@{{ java_version }}"
    state: present
  when: ansible_os_family == "Darwin"
  become: false
  tags: [java]

- name: Verify Java is available
  ansible.builtin.command: java -version
  register: java_version_output
  changed_when: false
  tags: [java]

- name: Show Java version
  ansible.builtin.debug:
    msg: "{{ java_version_output.stderr_lines | first }}"
  tags: [java]
