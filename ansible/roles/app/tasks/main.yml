---
# Role: app – deploy the application with Docker Compose.
# Sequence: write config -> validate -> record running version -> start DB ->
# deploy app -> verify health -> on failure restore the previous version.
# The app container is recreated in place, so there is a brief outage during
# the switch (this is not a zero-downtime deployment).

- name: Install compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"
  tags: [app, config, deploy]

- name: Install database init script (mounted by the compose file)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/init.sql"
    dest: "{{ app_dir }}/scripts/init.sql"
    mode: "0644"
  tags: [app, config, deploy]

- name: Write environment file (contains secrets)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
  no_log: true
  tags: [app, config, deploy]

- name: Validate the compose configuration
  ansible.builtin.command: docker compose config --quiet
  args:
    chdir: "{{ app_dir }}"
  changed_when: false
  tags: [app, deploy]

- name: Record the currently deployed image (if any)
  ansible.builtin.command: docker inspect --format '{% raw %}{{.Config.Image}}{% endraw %}' workout-app
  register: app_current_image
  failed_when: false
  changed_when: false
  tags: [app, deploy]

- name: Remember the previous version
  ansible.builtin.set_fact:
    app_previous_version: "{{ (app_current_image.stdout | trim).split(':') | last if app_current_image.rc == 0 else '' }}"
  tags: [app, deploy]

- name: Deploy with automatic recovery
  tags: [app, deploy, health]
  block:
    - name: Start the database and wait until healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services: [db]
        state: present
        wait: true
        wait_timeout: 120

    - name: Deploy the application image and wait until the container is healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services: [app]
        dependencies: false
        state: present
        pull: missing
        wait: true
        wait_timeout: 240
      register: app_deploy_result

    - name: Verify the application health endpoint reports UP
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ app_port }}/actuator/health"
        return_content: true
        timeout: 10
      delegate_to: localhost
      become: false
      register: app_health
      until: app_health.status == 200 and (app_health.json.status | default('')) == 'UP'
      retries: 12
      delay: 10
      changed_when: false

  rescue:
    - name: Restore the previous version
      ansible.builtin.command: docker compose up -d --no-deps --wait --wait-timeout 240 app
      args:
        chdir: "{{ app_dir }}"
      environment:
        APP_VERSION: "{{ app_previous_version }}"
      changed_when: true
      when:
        - app_previous_version | length > 0
        - app_previous_version != app_version
      register: app_restore_result

    - name: Report failure and stop
      ansible.builtin.fail:
        msg: >-
          Deployment of {{ app_image }}:{{ app_version }} failed health verification.
          {{ 'Previous version ' ~ app_previous_version ~ ' was restored.'
             if (app_restore_result is defined and app_restore_result is not skipped and app_restore_result.rc | default(1) == 0)
             else 'No previous version could be restored (first deployment or restore failed).' }}
          Check: docker logs workout-app

- name: Show running containers
  ansible.builtin.command: docker ps --filter name=workout- --format '{% raw %}{{.Names}}  {{.Status}}  {{.Ports}}{% endraw %}'
  register: app_containers_list
  changed_when: false
  tags: [app]

- name: Report deployment result
  ansible.builtin.debug:
    msg: "{{ app_containers_list.stdout_lines }}"
  tags: [app]
