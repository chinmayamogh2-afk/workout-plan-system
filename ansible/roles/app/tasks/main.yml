---
# =============================================================
# Role: app – Deploy Workout Plan System via Docker Compose
# Idempotent: uses docker-compose up which handles re-runs
# =============================================================

- name: Copy docker-compose.yml to app directory
  copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: '0644'
  tags: [app, deploy]

- name: Copy env file template
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: '0600'
  tags: [app, deploy]

- name: Pull latest Docker images
  command: docker compose pull
  args:
    chdir: "{{ app_dir }}"
  register: pull_result
  changed_when: "'Pulled' in pull_result.stdout"
  ignore_errors: true
  tags: [app, deploy]

- name: Start application with Docker Compose
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}"
  register: compose_result
  changed_when: compose_result.rc == 0
  tags: [app, deploy]

- name: Wait for application to be healthy
  uri:
    url: "http://localhost:{{ app_port }}/actuator/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 12
  delay: 10
  until: health_check.status == 200
  tags: [app, health]

- name: Display running containers
  command: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
  register: containers_list
  changed_when: false
  tags: [app]

- name: Show running containers
  debug:
    msg: "{{ containers_list.stdout_lines }}"
  tags: [app]
