# =============================================================
# Ansible Inventory – Workout Plan Management System
# =============================================================
# For local development/demo: use localhost with connection=local
# For remote servers: replace localhost with IP/hostname

[local]
localhost ansible_connection=local

[app_servers]
# Example remote server (replace with actual IP):
# 192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[db_servers]
# Database server (can be same as app_server or separate)
# 192.168.1.100 ansible_user=ubuntu

[all:vars]
# Application configuration
app_name=workout-plan-system
app_version=1.0.0
app_port=8080
app_dir=/opt/workout-app

# Docker configuration
docker_image=devopsproject/workout-plan-system
docker_tag=latest

# Database configuration (override via --extra-vars or vault)
db_name=workout_db
db_user=workout_user
db_password=workout_pass
db_root_password=root_secret
