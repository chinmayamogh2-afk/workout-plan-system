# =============================================================
# Ansible Inventory – Workout Plan Management System
# =============================================================
# Shared variables live in group_vars/all.yml (single source of truth).
# Secrets are never stored here: pass them with -e @secrets.yml (git-ignored)
# or an ansible-vault file. See secrets.example.yml.

[local]
localhost ansible_connection=local

[app_servers]
# Remote Ubuntu/Debian server example (replace with the real address):
# 192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
# Target it with:  ansible-playbook playbook.yml -e target_hosts=app_servers -e @secrets.yml
