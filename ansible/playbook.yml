---
# =============================================================
# Ansible Playbook – Workout Plan Management System
# Provisions: common packages, Java, Docker + Compose plugin, and deploys
# the application image with health verification and automatic recovery.
#
#   ansible-playbook playbook.yml -e @secrets.yml --ask-become-pass
#   ansible-playbook playbook.yml -e target_hosts=app_servers -e @secrets.yml
#   ansible-playbook playbook.yml --syntax-check
#
# Idempotent: a second run reports changed=0 when nothing differs.
# =============================================================

- name: Configure Workout Plan Management System
  hosts: "{{ target_hosts | default('local') }}"
  become: "{{ use_become }}"
  gather_facts: true

  roles:
    - preflight
    - common
    - java
    - docker
    - app
