---
# Group variables – shared across all hosts. NO SECRETS HERE.
app_name: workout-plan-system
app_port: 8080
app_dir: /opt/workout-app

# Image coordinates must match the Jenkins pipeline / docker-compose.yml.
# In real deployments pin app_version to a build tag (e.g. 1.0.42), not "latest".
app_image: devopsproject/workout-plan-system
app_version: latest

db_name: workout_db
db_user: workout_user

java_version: "21"

# Users allowed to run docker without sudo (e.g. the Jenkins agent user)
docker_users: []

# Set false to run without privilege escalation (e.g. already root, or testing)
use_become: true

# Required secrets – supply via `-e @secrets.yml` or ansible-vault. The preflight
# role fails with a clear message if any is missing:
#   db_password, db_root_password, admin_password, trainer_password
