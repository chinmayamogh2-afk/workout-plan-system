# ============================================================
# Workout Plan Management System – Application Configuration
# Sensitive values are read from environment variables.
# ============================================================

spring.application.name=workout-plan-system

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workout_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:workout_user}
spring.datasource.password=${DB_PASSWORD:workout_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Server ---
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.app.name=Workout Plan Management System
management.info.app.version=1.0.0

# --- Logging ---
logging.level.com.devops=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
