# ============================================================
# Workout Plan Management System – Application Configuration
# Sensitive values are read from environment variables.
# ============================================================

spring.application.name=workout-plan-system

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workout_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:workout_user}
spring.datasource.password=${DB_PASSWORD:workout_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Server ---
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# --- Actuator ---
# Only the health probe is exposed; details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.app.name=Workout Plan Management System
management.info.app.version=1.0.0

# --- Seed users (development defaults are overridden via environment) ---
app.seed.admin-password=${APP_ADMIN_PASSWORD:Admin@123}
app.seed.trainer-password=${APP_TRAINER_PASSWORD:Trainer@123}

# --- Logging ---
logging.level.com.devops=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
