<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Workout Plans | FitFlow</title>
    <meta name="description" content="Browse, search and filter all workout plans"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">💪</div><span class="brand-text">FitFlow</span></div>
    <ul class="sidebar-nav">
        <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
        <li class="nav-item"><a th:href="@{/workouts}" class="nav-link active"><span class="nav-icon">🏋️</span><span>Workout Plans</span></a></li>
        <li class="nav-item"><a th:href="@{/workouts/new}" class="nav-link"><span class="nav-icon">➕</span><span>Create Plan</span></a></li>
    </ul>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar"><span sec:authentication="name">U</span></div>
            <div class="user-details">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role">
                    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
                    <span sec:authorize="!hasRole('ADMIN')" class="role-badge trainer">Trainer</span>
                </div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout" id="logoutBtn">🚪 Logout</button>
        </form>
    </div>
</nav>

<div class="main-wrapper">
    <header class="topbar">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
        <div class="topbar-title">Workout Plans</div>
        <div class="topbar-right"><span class="topbar-time" id="topbarTime"></span></div>
    </header>

    <div class="flash-container" th:if="${successMessage != null}">
        <div class="flash flash-success" th:text="${successMessage}"></div>
    </div>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Workout Plans</h1>
                <p class="page-subtitle" th:text="${isAdmin ? 'All plans in the system' : 'Your workout plans'}"></p>
            </div>
            <a th:href="@{/workouts/new}" class="btn btn-primary" id="createBtn">➕ New Plan</a>
        </div>

        <!-- Search & Filter -->
        <form th:action="@{/workouts}" method="get" class="filter-card" id="filterForm">
            <div class="filter-grid">
                <div class="form-group">
                    <label class="form-label">Search</label>
                    <input type="text" name="keyword" class="form-input" id="searchInput"
                           th:value="${keyword}" placeholder="Search name, description, muscle..."/>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-input" id="statusFilter">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statusValues}" th:value="${s}"
                                th:text="${s}" th:selected="${s == selectedStatus}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-input" id="difficultyFilter">
                        <option value="">All Levels</option>
                        <option th:each="d : ${difficultyValues}" th:value="${d}"
                                th:text="${d}" th:selected="${d == selectedDifficulty}"></option>
                    </select>
                </div>
                <div class="form-group filter-actions">
                    <button type="submit" class="btn btn-primary" id="applyFilter">🔍 Filter</button>
                    <a th:href="@{/workouts}" class="btn btn-secondary" id="clearFilter">✖ Clear</a>
                </div>
            </div>
        </form>

        <!-- Plans Table -->
        <div class="table-card">
            <div th:if="${#lists.isEmpty(plans)}" class="empty-state">
                <div class="empty-icon">🔍</div>
                <p>No workout plans found.</p>
                <a th:href="@{/workouts/new}" class="btn btn-primary">Create One</a>
            </div>

            <table class="data-table" th:if="${!#lists.isEmpty(plans)}" id="plansTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Muscle Group</th>
                        <th>Difficulty</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Trainer</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="plan, stat : ${plans}" th:id="${'plan-row-' + plan.id}">
                        <td th:text="${stat.count}"></td>
                        <td class="plan-name" th:text="${plan.name}"></td>
                        <td th:text="${plan.targetMuscleGroup}"></td>
                        <td>
                            <span class="badge" th:classappend="${'badge-' + plan.difficulty.name().toLowerCase()}"
                                  th:text="${plan.difficulty}"></span>
                        </td>
                        <td th:text="${plan.durationMinutes + ' min'}"></td>
                        <td>
                            <span class="status-badge" th:classappend="${'status-' + plan.status.name().toLowerCase()}"
                                  th:text="${plan.status}"></span>
                        </td>
                        <td th:text="${plan.trainerName}"></td>
                        <td class="action-cell">
                            <a th:href="@{/workouts/{id}(id=${plan.id})}" class="btn btn-xs btn-view">View</a>
                            <a th:href="@{/workouts/{id}/edit(id=${plan.id})}" class="btn btn-xs btn-edit"
                               th:if="${isAdmin or plan.createdBy == #authentication.name}">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
