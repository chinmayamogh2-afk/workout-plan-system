<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${plan.name + ' | FitFlow'}">Plan Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">💪</div><span class="brand-text">FitFlow</span></div>
    <ul class="sidebar-nav">
        <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
        <li class="nav-item"><a th:href="@{/workouts}" class="nav-link active"><span class="nav-icon">🏋️</span><span>Workout Plans</span></a></li>
        <li class="nav-item"><a th:href="@{/workouts/new}" class="nav-link"><span class="nav-icon">➕</span><span>Create Plan</span></a></li>
    </ul>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar"><span sec:authentication="name">U</span></div>
            <div class="user-details">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role">
                    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
                    <span sec:authorize="!hasRole('ADMIN')" class="role-badge trainer">Trainer</span>
                </div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout" id="logoutBtn">🚪 Logout</button>
        </form>
    </div>
</nav>

<div class="main-wrapper">
    <header class="topbar">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
        <div class="topbar-title" th:text="${plan.name}">Plan Detail</div>
        <div class="topbar-right"><span class="topbar-time" id="topbarTime"></span></div>
    </header>

    <div class="flash-container" th:if="${successMessage != null}">
        <div class="flash flash-success" th:text="${successMessage}"></div>
    </div>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${plan.name}" id="planName">Plan Name</h1>
                <div class="plan-meta">
                    <span class="status-badge" th:classappend="${'status-' + plan.status.name().toLowerCase()}"
                          th:text="${plan.status}" id="planStatus">DRAFT</span>
                    <span class="badge" th:classappend="${'badge-' + plan.difficulty.name().toLowerCase()}"
                          th:text="${plan.difficulty}"></span>
                    <span class="meta-text" th:text="${plan.durationMinutes + ' minutes'}"></span>
                </div>
            </div>
            <div class="detail-actions">
                <a th:href="@{/workouts}" class="btn btn-secondary">← Back</a>
                <a th:href="@{/workouts/{id}/edit(id=${plan.id})}" class="btn btn-primary" id="editBtn"
                   th:if="${isAdmin or isOwner}">✏️ Edit</a>
            </div>
        </div>

        <div class="detail-grid">
            <!-- Main Info -->
            <div class="detail-card span-2">
                <h2 class="card-title">Description</h2>
                <p class="card-text" th:text="${plan.description}" id="planDescription"></p>
            </div>

            <div class="detail-card span-2">
                <h2 class="card-title">Exercise Details</h2>
                <p class="card-text exercise-text" th:text="${plan.exerciseDetails}" id="planExercise"></p>
            </div>

            <!-- Metadata -->
            <div class="detail-card">
                <h2 class="card-title">Plan Info</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Target Muscle</span>
                        <span class="info-value" th:text="${plan.targetMuscleGroup}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Trainer</span>
                        <span class="info-value" th:text="${plan.trainerName}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Created By</span>
                        <span class="info-value" th:text="${plan.createdBy}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Created</span>
                        <span class="info-value" th:text="${#temporals.format(plan.createdAt, 'dd MMM yyyy HH:mm')}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Last Updated</span>
                        <span class="info-value" th:text="${#temporals.format(plan.updatedAt, 'dd MMM yyyy HH:mm')}"></span>
                    </div>
                </div>
            </div>

            <!-- Workflow Panel -->
            <div class="detail-card">
                <h2 class="card-title">Workflow Status</h2>
                <div class="workflow-steps">
                    <div class="wf-step" th:classappend="${plan.status.name() == 'DRAFT' ? 'wf-current' : (plan.status.ordinal() > 0 ? 'wf-done' : '')}">
                        <div class="wf-dot"></div>
                        <div class="wf-label">Draft</div>
                    </div>
                    <div class="wf-line"></div>
                    <div class="wf-step" th:classappend="${plan.status.name() == 'SUBMITTED' ? 'wf-current' : (plan.status.ordinal() > 1 ? 'wf-done' : '')}">
                        <div class="wf-dot"></div>
                        <div class="wf-label">Submitted</div>
                    </div>
                    <div class="wf-line"></div>
                    <div class="wf-step" th:classappend="${plan.status.name() == 'APPROVED' ? 'wf-current' : (plan.status.ordinal() > 2 ? 'wf-done' : '')}">
                        <div class="wf-dot"></div>
                        <div class="wf-label">Approved</div>
                    </div>
                    <div class="wf-line"></div>
                    <div class="wf-step" th:classappend="${plan.status.name() == 'PUBLISHED' ? 'wf-current' : ''}">
                        <div class="wf-dot"></div>
                        <div class="wf-label">Published</div>
                    </div>
                </div>

                <!-- Status change buttons -->
                <div class="status-actions">
                    <!-- Trainer: can submit own draft -->
                    <form th:action="@{/workouts/{id}/status(id=${plan.id})}" method="post"
                          th:if="${isOwner and plan.status.name() == 'DRAFT'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="newStatus" value="SUBMITTED"/>
                        <button type="submit" class="btn btn-warning" id="submitBtn">📤 Submit for Review</button>
                    </form>

                    <!-- Admin: approve submitted -->
                    <form th:action="@{/workouts/{id}/status(id=${plan.id})}" method="post"
                          sec:authorize="hasRole('ADMIN')"
                          th:if="${plan.status.name() == 'SUBMITTED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="newStatus" value="APPROVED"/>
                        <button type="submit" class="btn btn-success" id="approveBtn">✅ Approve</button>
                    </form>

                    <!-- Admin: reject back to draft -->
                    <form th:action="@{/workouts/{id}/status(id=${plan.id})}" method="post"
                          sec:authorize="hasRole('ADMIN')"
                          th:if="${plan.status.name() == 'SUBMITTED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="newStatus" value="DRAFT"/>
                        <button type="submit" class="btn btn-danger" id="rejectBtn">↩️ Reject (Back to Draft)</button>
                    </form>

                    <!-- Admin: publish approved -->
                    <form th:action="@{/workouts/{id}/status(id=${plan.id})}" method="post"
                          sec:authorize="hasRole('ADMIN')"
                          th:if="${plan.status.name() == 'APPROVED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="newStatus" value="PUBLISHED"/>
                        <button type="submit" class="btn btn-primary" id="publishBtn">🚀 Publish</button>
                    </form>
                </div>

                <!-- Delete -->
                <form th:action="@{/workouts/{id}/delete(id=${plan.id})}" method="post" class="delete-form"
                      th:if="${isAdmin or isOwner}"
                      onsubmit="return confirm('Are you sure you want to delete this plan?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" id="deleteBtn">🗑️ Delete</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
