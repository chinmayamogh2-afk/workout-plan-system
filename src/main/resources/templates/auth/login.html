<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | FitFlow Workout Manager</title>
    <meta name="description" content="Login to FitFlow Workout Plan Management System"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-body">
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">💪</div>
            <h1 class="login-title">FitFlow</h1>
            <p class="login-subtitle">Workout Plan Management System</p>
        </div>

        <!-- Error message -->
        <div class="alert alert-error" th:if="${param.error}" id="loginError">
            <span>⚠️</span> Invalid username or password. Please try again.
        </div>

        <!-- Logout message -->
        <div class="alert alert-success" th:if="${param.logout}" id="logoutMsg">
            <span>✅</span> You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="login-form" id="loginForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="Enter your username" required autocomplete="username"/>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Enter your password" required autocomplete="current-password"/>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Sign In →
            </button>
        </form>

        <div class="login-hints">
            <p class="hint-title">Demo Credentials</p>
            <div class="hint-grid">
                <div class="hint-item">
                    <span class="hint-role">Admin</span>
                    <code>admin / Admin@123</code>
                </div>
                <div class="hint-item">
                    <span class="hint-role">Trainer</span>
                    <code>trainer / Trainer@123</code>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
