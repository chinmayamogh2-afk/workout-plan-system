<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | FitFlow' : 'FitFlow – Workout Plan Manager'}">FitFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Sidebar Navigation -->
<nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">💪</div>
        <span class="brand-text">FitFlow</span>
    </div>

    <ul class="sidebar-nav">
        <li class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/workouts}" class="nav-link" th:classappend="${currentPage == 'workouts' ? 'active' : ''}">
                <span class="nav-icon">🏋️</span>
                <span>Workout Plans</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/workouts/new}" class="nav-link" th:classappend="${currentPage == 'create' ? 'active' : ''}">
                <span class="nav-icon">➕</span>
                <span>Create Plan</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <span sec:authentication="name" class="avatar-text">U</span>
            </div>
            <div class="user-details">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role">
                    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
                    <span sec:authorize="!hasRole('ADMIN')" class="role-badge trainer">Trainer</span>
                </div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout" id="logoutBtn">
                <span>🚪</span> Logout
            </button>
        </form>
    </div>
</nav>

<!-- Main content wrapper -->
<div class="main-wrapper">
    <!-- Top bar -->
    <header class="topbar">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">
            <span>☰</span>
        </button>
        <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</div>
        <div class="topbar-right">
            <span class="topbar-time" id="topbarTime"></span>
        </div>
    </header>

    <!-- Flash messages -->
    <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
        <div class="flash flash-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
        <div class="flash flash-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
    </div>

    <!-- Page content injected here -->
    <main class="content" th:replace="${content}">
        <!-- content placeholder -->
    </main>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
