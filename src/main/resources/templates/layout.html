<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | FitFlow' : 'FitFlow – Workout Plan Manager'}">FitFlow</title>
    <meta name="description" th:content="${metaDesc != null ? metaDesc : 'FitFlow – Premium Workout Plan Management System'}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Sidebar Navigation -->
<nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-brand">
        <div class="brand-icon">💪</div>
        <div>
            <div class="brand-text">FitFlow</div>
            <div class="brand-tagline">Workout Management</div>
        </div>
    </div>

    <ul class="sidebar-nav" role="list">
        <li class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link" id="navDashboard"
               th:classappend="${currentPage == 'dashboard' ? ' active' : ''}">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/workouts}" class="nav-link" id="navWorkouts"
               th:classappend="${currentPage == 'workouts' ? ' active' : ''}">
                <span class="nav-icon">🏋️</span>
                <span>Workout Plans</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/workouts/new}" class="nav-link" id="navCreate"
               th:classappend="${currentPage == 'create' ? ' active' : ''}">
                <span class="nav-icon">➕</span>
                <span>Create Plan</span>
            </a>
        </li>
        <li class="nav-item" style="margin-top:12px">
            <a th:href="@{/demo}" class="nav-link demo-link" id="navDemo">
                <span class="nav-icon">🚀</span>
                <span>Explore Demo</span>
                <span class="nav-badge">NEW</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1)}">U</span>
            </div>
            <div class="user-details">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role">
                    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
                    <span sec:authorize="!hasRole('ADMIN')" class="role-badge trainer">Trainer</span>
                </div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout" id="logoutBtn">
                <span>🚪</span> Sign Out
            </button>
        </form>
    </div>
</nav>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Main content wrapper -->
<div class="main-wrapper">
    <!-- Top bar -->
    <header class="topbar" role="banner">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation" aria-expanded="false">
            <span>☰</span>
        </button>
        <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</div>
        <div class="topbar-right">
            <span class="topbar-time" id="topbarTime"></span>
            <div class="topbar-badge" sec:authorize="hasRole('ADMIN')">
                🛡️ Admin
            </div>
        </div>
    </header>

    <!-- Flash messages -->
    <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
        <div class="flash flash-success" th:if="${successMessage != null}">
            <span class="flash-icon">✅</span>
            <span th:text="${successMessage}"></span>
        </div>
        <div class="flash flash-error" th:if="${errorMessage != null}">
            <span class="flash-icon">❌</span>
            <span th:text="${errorMessage}"></span>
        </div>
    </div>

    <!-- Page content injected here -->
    <main class="content" th:replace="${content}">
        <!-- content placeholder -->
    </main>
</div>

<!-- Floating AI Assistant -->
<button class="ai-assistant-fab" id="aiFab" aria-label="Open AI assistant" title="FitBot – AI Workout Assistant">
    🤖
</button>
<div class="ai-assistant-drawer closed" id="aiDrawer" role="complementary" aria-label="AI Assistant">
    <div class="ai-panel-header">
        <div class="ai-avatar">🤖</div>
        <div>
            <div class="ai-name">FitBot Assistant</div>
            <div class="ai-status">Online</div>
        </div>
        <span class="ai-mode-badge">Demo Mode</span>
    </div>
    <div class="ai-messages" id="aiMessages" role="log" aria-live="polite"></div>
    <div class="ai-suggestions">
        <button class="ai-chip" title="Ask about workout plans">Create a workout plan</button>
        <button class="ai-chip" title="Beginner advice">I'm a beginner</button>
        <button class="ai-chip" title="Nutrition tips">Protein intake?</button>
        <button class="ai-chip" title="Workflow help">How does the workflow work?</button>
    </div>
    <div class="ai-input-area">
        <textarea class="ai-input" id="aiInput" placeholder="Ask FitBot anything..." rows="1" aria-label="Message FitBot"></textarea>
        <button class="ai-send" id="aiSend" aria-label="Send message">➤</button>
    </div>
    <div style="padding:8px 20px;border-top:1px solid var(--border);text-align:right">
        <button class="ai-clear" id="aiClear">↺ New chat</button>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
